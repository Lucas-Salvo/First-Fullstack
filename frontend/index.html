<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Básico</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
    
<body>
    <header>
        <h1>Usuarios</h1>
        <p>Gerenciamento de usuários cadastrados</p>
    </header>
    <main>
        <section id="cadastro-usuarios">
            <h2>Cadastrar Novo Usuário</h2>
            <form id="formUsuario">
                <input type="text" id="nome" placeholder="Digite o nome" required>
                <input type="number" id="idade" placeholder="Digite a idade" required>
                <button type="submit" id="btnPost">Cadastrar usuário</button>
            </form>
        </section>

        <section id="lista-usuarios">
            <h2>Lista de usuários</h2>
            <div id="usuarios">
                Carregando usuários...
            </div>
        </section>
    </main>
</body>
</html>
